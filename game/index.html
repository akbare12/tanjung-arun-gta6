<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TANJUNG ARUN — BADAI ARUNIKA</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#2b2140;font-family:Arial,Helvetica,sans-serif}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hud{position:fixed;inset:0;pointer-events:none;color:#fff;user-select:none}
  .panel{background:rgba(12,10,24,.78);border:1px solid rgba(255,255,255,.22);border-radius:8px;
    padding:8px 12px;box-shadow:0 2px 10px rgba(0,0,0,.45)}
  .yellow{color:#FFD23F}.red{color:#FF5A4E}.teal{color:#4FD8E0}
  .small{font-size:12px;letter-spacing:.08em}
  .big{font-size:20px;font-weight:800;letter-spacing:.04em}
  /* layout zones */
  #tl{position:absolute;top:14px;left:14px}
  #tc{position:absolute;top:14px;left:50%;transform:translateX(-50%);text-align:center;min-width:340px}
  #tr{position:absolute;top:14px;right:14px;text-align:right}
  #bl{position:absolute;bottom:16px;left:14px}
  #br{position:absolute;bottom:16px;right:14px;text-align:right}
  #dispatch{position:absolute;top:150px;left:14px;width:268px}
  #dialog{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);width:520px;display:flex;gap:10px;align-items:center}
  #floaters{position:absolute;inset:0}
  .floater{position:absolute;font-weight:900;font-size:26px;color:#FFD23F;
    text-shadow:0 2px 0 #7a2d00,0 0 14px rgba(255,180,60,.8)}
  .floater.sub{font-size:18px;color:#fff}
  .stars{font-size:22px;letter-spacing:2px;color:#FFD23F;text-shadow:0 0 8px rgba(255,210,63,.7)}
  .stars .off{color:rgba(255,255,255,.35);text-shadow:none}
  .bar{height:10px;background:rgba(255,255,255,.18);border-radius:5px;overflow:hidden;margin-top:4px}
  .bar>i{display:block;height:100%;background:#FFD23F}
  .bar.hp>i{background:#4ADE80}.bar.ar>i{background:#4FC3F7}
  .row{display:flex;justify-content:space-between;gap:8px}
  .unit{padding:5px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:13px}
  .unit:last-child{border-bottom:0}
  .unit b{color:#FFD23F}
  .unit .tac{float:right;color:#4FD8E0;font-weight:700}
  .portrait{width:52px;height:52px;border-radius:6px;flex:0 0 52px;display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:900;background:linear-gradient(135deg,#E86A92,#6B4A8F);border:2px solid #FFD23F}
  /* minimap */
  #minimapWrap{text-align:center}
  #minimap{border-radius:50%;border:3px solid rgba(255,255,255,.85);box-shadow:0 0 0 3px rgba(0,0,0,.45),0 4px 14px rgba(0,0,0,.5);background:#1b2b4a}
  #districtTag{margin-top:5px;font-size:12px;font-weight:700;letter-spacing:.06em;
    text-shadow:0 1px 3px #000}
  /* title screen */
  #title{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,6,24,.88) 0%,rgba(10,6,24,.55) 46%,rgba(10,6,24,0) 78%)}
  #titleInner{position:absolute;left:56px;top:64px;width:620px}
  #gameTitle{font-size:64px;font-weight:900;line-height:.95;letter-spacing:.01em;
    text-shadow:0 4px 0 #5b2a68,0 8px 24px rgba(0,0,0,.6)}
  #gameTitle .a{color:#FFD23F}
  #tagline{margin-top:10px;font-size:17px;color:#FFE9A8;letter-spacing:.06em}
  #menu{margin-top:26px;font-size:19px;font-weight:700;line-height:1.9}
  #menu .sel{color:#FFD23F}
  #menu .sel:before{content:"▶ "}
  #slots{position:absolute;left:56px;bottom:96px;display:flex;gap:14px}
  .slot{width:238px;background:rgba(12,10,24,.82);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:12px 14px}
  .slot.sel{border-color:#FFD23F;box-shadow:0 0 0 2px rgba(255,210,63,.5)}
  .slot h3{margin:0 0 6px;font-size:15px;color:#FFD23F}
  .slot p{margin:3px 0;font-size:13px;color:#eee}
  .slot .empty{color:#bbb;font-size:14px;padding:18px 0;text-align:center}
  #shopStrip{position:absolute;right:56px;bottom:96px;width:300px}
  #titleFoot{position:absolute;left:56px;bottom:26px;font-size:12px;color:#ddd;letter-spacing:.08em}
  /* map screen */
  #mapTitle{position:absolute;top:14px;left:14px}
  #mapSide{position:absolute;right:14px;top:14px;width:330px}
  #mapBottom{position:absolute;left:14px;right:14px;bottom:14px}
  .mapLabel{position:absolute;transform:translate(-50%,-50%);font-weight:900;letter-spacing:.08em;
    color:#fff;text-shadow:0 2px 4px #000,0 0 10px rgba(0,0,0,.8);white-space:nowrap}
  .mapLabel.district{font-size:20px;color:#FFD23F}
  .mapLabel.road{font-size:12px;color:#EAF6FF;font-weight:700}
  .mapLabel.place{font-size:13px;color:#BFEFFF}
  .missionList{font-size:13px;line-height:1.55}
  .missionList .done{color:#7BE495}.missionList .cur{color:#FFD23F;font-weight:700}.missionList .lock{color:#999}
  .chip{display:inline-block;background:rgba(255,210,63,.16);border:1px solid #FFD23F;border-radius:6px;
    padding:2px 8px;margin:2px 4px 2px 0;font-size:12px;font-weight:700}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;
    background:#2b2140;font-size:18px;letter-spacing:.1em;z-index:5}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="loading">MEMUAT TANJUNG ARUN…</div>
<script src="./vendor/three.min.js"></script>
<script src="./src/world.js"></script>
<script src="./src/hud.js"></script>
<script src="./src/main.js"></script>
</body>
</html>
